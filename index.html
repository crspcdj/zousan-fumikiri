const cv = document.getElementById('c');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;

// ---------- おと ----------
let ac = null;
function audio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state !== 'running') ac.resume().catch(() => {});
  return ac;
}
// iPhone・iPad は、さわった しゅんかんに おとの ロックを はずさないと なにも ならない。
// むおんの おとを ながしつづけると、マナーモードでも おとが でる。
const silentEl = (() => {
  const rate = 8000, n = rate / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  const el = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
  el.loop = true; el.volume = 0.01; el.setAttribute('playsinline', '');
  return el;
})();
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const a = audio();
  const src = a.createBufferSource(); src.buffer = a.createBuffer(1, 1, 22050);
  src.connect(a.destination); src.start(0);
  if (silentEl.paused) silentEl.play().catch(() => {});
}
['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click', 'keydown']
  .forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ac) { ac.resume().catch(() => {}); if (silentEl.paused) silentEl.play().catch(() => {}); }
});
function env(g, t, peak, attack, decay) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
}
// カンカン
function kan() {
  const a = audio(), t = a.currentTime;
  const g = a.createGain(); env(g, t, 0.22, 0.004, 0.38);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  g.connect(lp); lp.connect(a.destination);
  [[740, 'square', 0.5], [1110, 'sine', 0.6], [1480, 'sine', 0.3]].forEach(([f, type, v]) => {
    const o = a.createOscillator(); o.type = type; o.frequency.value = f;
    const og = a.createGain(); og.gain.value = v;
    o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.45);
  });
}
// パオーン
function paon() {
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(330, t);
  o.frequency.exponentialRampToValueAtTime(760, t + 0.18);
  o.frequency.setValueAtTime(760, t + 0.55);
  o.frequency.exponentialRampToValueAtTime(420, t + 1.0);
  const lfo = a.createOscillator(); lfo.frequency.value = 28;
  const lg = a.createGain(); lg.gain.value = 25; lfo.connect(lg); lg.connect(o.frequency);
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.5;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.08);
  g.gain.setValueAtTime(0.45, t + 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
  o.connect(bp); bp.connect(g); g.connect(a.destination);
  o.start(t); lfo.start(t); o.stop(t + 1.1); lfo.stop(t + 1.1);
}
// ドスン（あしおと）

// カバ「ブォ」
function buo() {

  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
  const g = a.createGain(); env(g, t, 0.35, 0.02, 0.4);
  o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.5);
}
// ワニ「パクッ」
function paku() {
  const a = audio(), t = a.currentTime;
  [0, 0.12].forEach((d, i) => {
    const len = 0.06, buf = a.createBuffer(1, a.sampleRate * len, a.sampleRate);
    const ch = buf.getChannelData(0);
    for (let k = 0; k < ch.length; k++) ch[k] = (Math.random() * 2 - 1) * (1 - k / ch.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = i ? 1800 : 1200; bp.Q.value = 2;
    const g = a.createGain(); g.gain.value = 0.9;

// カメ「ピョコ」

// ほかの どうぶつ（どうぶつごとに こえの たかさが ちがう）
function pii(f) {

    const o = a.createOscillator(); o.type = 'triangle';
    const f0 = f * (i ? 1.25 : 1);

// ライオン・クマ「ガオー」
function gao() {

  o.frequency.setValueAtTime(110, t); o.frequency.linearRampToValueAtTime(150, t + 0.25); o.frequency.exponentialRampToValueAtTime(70, t + 0.7);
  const lfo = a.createOscillator(); lfo.frequency.value = 35;
  const lg = a.createGain(); lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const g = a.createGain(); env(g, t, 0.45, 0.06, 0.65);
  o.connect(lp); lp.connect(g); g.connect(a.destination);
  o.start(t); lfo.start(t); o.stop(t + 0.8); lfo.stop(t + 0.8);

// ブタ「ブーブー」
function buhi() {

// ニワトリ「コケコッコー」
function koke() {
  const a = audio(), t = a.currentTime;
  [[0, 700, 0.08], [0.1, 900, 0.08], [0.2, 800, 0.08], [0.32, 1100, 0.35]].forEach(([d, f, len]) => {
    const o = a.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(f, t + d); o.frequency.linearRampToValueAtTime(f * 1.15, t + d + len * 0.6);
    const g = a.createGain(); env(g, t + d, 0.25, 0.01, len);
    o.connect(g); g.connect(a.destination); o.start(t + d); o.stop(t + d + len + 0.05);

}
// サル・キツネ「キキッ」
function kii() {

    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500;
    const g = a.createGain(); env(g, t + d, 0.2, 0.004, 0.07);

// クマ「グオー」（ライオンより ひくい）
function guo() {
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(80, t); o.frequency.linearRampToValueAtTime(105, t + 0.3); o.frequency.exponentialRampToValueAtTime(55, t + 0.8);
  const lfo = a.createOscillator(); lfo.frequency.value = 25;
  const lg = a.createGain(); lg.gain.value = 14; lfo.connect(lg); lg.connect(o.frequency);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
  const g = a.createGain(); env(g, t, 0.55, 0.08, 0.75);
  o.connect(lp); lp.connect(g); g.connect(a.destination);
  o.start(t); lfo.start(t); o.stop(t + 0.9); lfo.stop(t + 0.9);

// おに「ガオー！」
function gaoo() {

  const a = audio(), t = a.currentTime;

  for (let k = 0; k < ch.length; k++) ch[k] = (Math.random() * 2 - 1) * (1 - k / ch.length) * 0.6;
  const src = a.createBufferSource(); src.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.8;
  const g = a.createGain(); g.gain.value = 0.5;
  src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t);
}

// ♪ メロディ（フニクリ・フニクラ：1880年 ルイージ・デンツァ さっきょく。
//   さっきょくしゃは 1922ねんに なくなっていて、きょくの けんりは きれている。
//   かしは つかわず、おとも この プログラムで つくっている）
const NOTE = { G4: 392.00, A4: 440.00, Bb4: 466.16, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, F4: 349.23, R: 0 };
const TUNE = (() => {
  const A = [['E5', 3], ['D5', 1], ['R', 2]], B = [['F5', 2], ['E5', 1], ['D5', 2], ['F5', 1]],
    C = [['E5', 3], ['E5', 1], ['R', 2]], D = [['A4', 2], ['A4', 1], ['A4', 2], ['A4', 1]];
  return [...A, ...A, ...B, ...C, ...A, ...A, ...B, ...C,
    ['C5', 2], ['A4', 1], ['A4', 2], ['A4', 1], ...D,
    ['F5', 6], ['G5', 2], ['F5', 1], ['D5', 2], ['F5', 1],
    ['D5', 2], ['A4', 1], ['A4', 2], ['Bb4', 1], ['C5', 2], ['Bb4', 1], ['A4', 2], ['G4', 1], ['F4', 6]];
})();
const BEAT = 0.155;   // 8ぶおんぷ 1つぶんの ながさ
let melodyEnd = 0;
function playMelody() {
  const a = audio();
  let t = a.currentTime + 0.05, bar = 0;
  TUNE.forEach(([n, len]) => {
    const d = len * BEAT;
    if (n !== 'R') {
      const f = NOTE[n];
      [['triangle', 1, 0.3], ['square', 0.5, 0.08], ['sine', 2, 0.12]].forEach(([type, mul, vol]) => {
        const o = a.createOscillator(); o.type = type; o.frequency.value = f * mul;
        const g = a.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d * 0.95);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
      });
    }
    // 2はくごとに ひくい おと（ポン）
    if (bar % 6 === 0) {
      const o = a.createOscillator(); o.type = 'sine'; o.frequency.value = 174.61;
      const g = a.createGain(); env(g, t, 0.18, 0.01, 0.3);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.35);
    }
    bar += len; t += d;
  });
  melodyEnd = performance.now() / 1000 + (t - a.currentTime);
}
function melodyPlaying() { return performance.now() / 1000 < melodyEnd; }
// とことこ
function toko(hi) {
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(); o.type = 'triangle';

  const g = a.createGain(); env(g, t, 0.15, 0.004, 0.08);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.12);
}

// ---------- ゾウさんに のる どうぶつ ----------
// ぜんぶ プログラムで かいた オリジナルの どうぶつ（えもじは つかわない）

  { kind: 'usagi', w: 150, h: 175, voice: 'puu', cx: 10 },
  { kind: 'buta', w: 200, h: 112, voice: 'buhi', cx: 10 },
  { kind: 'kirin', w: 190, h: 225, voice: 'funfun', cx: 20 },
  { kind: 'saru', w: 150, h: 135, voice: 'kii', cx: 10 },
  { kind: 'kuma', w: 190, h: 140, voice: 'guo', cx: 20 },

  { kind: 'hitsuji', w: 180, h: 112, voice: 'mee', cx: 5 },

  { kind: 'kitsune', w: 210, h: 130, voice: 'konkon', cx: 15 },
];
let riders = [];
let actor = 'zou';          // 'zou' か 'oni'
const ONI = { kind: 'oni', voice: 'gaoo' };
function pickRiders() {
  const bag = POOL.slice();
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  // 3びき えらんで、よこに ながい どうぶつほど したに のる
  riders = bag.slice(0, 3).sort((a, b) => b.w - a.w).map(r => ({ ...r, jy: 0, vy: 0 }));
}

// ---------- けしき ----------
function rand(seed) { const x = Math.sin(seed * 127.1) * 43758.5453; return x - Math.floor(x); }

function drawTree(x, y, k, dark) {
  ctx.fillStyle = dark ? '#3b2a1e' : '#8a5a34'; ctx.fillRect(x - 8 * k, y - 50 * k, 16 * k, 50 * k);
  const c1 = dark || '#4e9e4a', c2 = dark || '#58ad52';
  ell(x, y - 80 * k, 45 * k, 45 * k, c1); ell(x - 25 * k, y - 60 * k, 30 * k, 28 * k, c2);
  ell(x + 25 * k, y - 62 * k, 30 * k, 28 * k, c2);
}
function drawPine(x, y, k, color, snow) {
  ctx.fillStyle = '#6b4a2e'; ctx.fillRect(x - 6 * k, y - 22 * k, 12 * k, 22 * k);
  for (let i = 0; i < 3; i++) {
    const w = (46 - i * 11) * k, top = y - (60 + i * 32) * k, bot = y - (14 + i * 30) * k;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + w, bot); ctx.lineTo(x - w, bot); ctx.fill();
    if (snow) {

  ctx.moveTo(x - 58 * k, y - 68 * k); ctx.lineTo(x, y - 120 * k); ctx.lineTo(x + 58 * k, y - 68 * k); ctx.fill();

// ---------- じょうたい ----------
let state = 'idle';     // idle → ringing → crossing → raising → moving → idle
let stateT = 0, rounds = 0, moveStepT = 0;
let barDown = 0;
let lightOn = false, kanTimer = 0, lightSide = 0;
let dir = 1;
let walkX = 0, walkDist = 0, lastStep = 0;
let trunkUp = 0, shake = 0, zouJump = 0, zouVy = 0;
const hits = [];
const puffs = [];
const clouds = [[0.15, 0.12, 1], [0.55, 0.08, 0.8], [0.85, 0.18, 1.1]];
const flakes = Array.from({ length: 90 }, (_, i) => [rand(i + 500), rand(i + 900), 0.5 + rand(i + 1300)]);

function start() {
  if (state !== 'idle') return;
  unlockAudio();
  // 4かいに 1かいくらい、ゾウさんの かわりに あかおにが わたってくる
  actor = Math.random() < 0.25 ? 'oni' : 'zou';
  pickRiders();
  state = 'ringing'; stateT = 0; kanTimer = 0;
}

function tap(px, py) {
  audio();
  if (state === 'idle') { start(); return; }
  if (state !== 'crossing') return;
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (Math.abs(px - h.x) < h.w && Math.abs(py - h.y) < h.h) { poke(h.r, h.x, h.y - h.h); return; }
  }
  if (actor === 'oni') { pokeOni(walkX, layout().trackY - 300 * s); return; }
  paon(); trunkUp = 1; say(WORDS.zou, px, py);
  if (zouJump === 0) zouVy = -300;
}
const VOICES = { buo, paku, pyoko, gao, guo, kuun, guwa, puu, buhi, funfun, kii, konkon, kero, mee, koke, gaoo };
const WORDS = { kaba: 'ブォー', wani: 'パクッ', kame: 'ピョコ', lion: 'ガオー', kuma: 'グオー', panda: 'クゥーン',
  penguin: 'グワッ', usagi: 'プゥプゥ', buta: 'ブーブー', kirin: 'フンフン', saru: 'キキッ', kitsune: 'コンコン',
  kaeru: 'ケロケロ', hitsuji: 'メェー', niwatori: 'コケコッコー', zou: 'パオーン', oni: 'ガオー！' };
const bubbles = [];
function say(word, x, y) { bubbles.push({ word, x, y, life: 1.3 }); }
function poke(r, px, py) {
  if (r.kind === 'oni') { pokeOni(px, py); return; }
  (VOICES[r.voice] || (() => pii(r.pitch)))();
  say(WORDS[r.kind], px, py);
  if (r.jy === 0) r.vy = -560;
}
// おにを タップ：「ガオー！」と さけんで ジャンプ
function pokeOni(px, py) {
  gaoo(); say(WORDS.oni, px, py);
  if (zouJump === 0) zouVy = -820;
}
function drawBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.life -= dt;
    if (b.life <= 0) { bubbles.splice(i, 1); continue; }
    const k = s * 1.1, rise = (1.3 - b.life) * 40 * s;
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.life * 2);
    ctx.font = `bold ${Math.round(34 * k)}px "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(b.word).width + 36 * k, h = 56 * k;
    const x = Math.max(w / 2 + 8, Math.min(W - w / 2 - 8, b.x)), y = Math.max(h, b.y - 60 * s - rise);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#333'; ctx.lineWidth = 3 * k;
    rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8453c'; ctx.fillText(b.word, x, y + 2 * k);
    ctx.restore();
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX, e.clientY); });

// ---------- レイアウト ----------
function layout() {
  const trackY = H * (W > H ? 0.66 : 0.6);
  const baseY = H * 0.96;
  const postGap = Math.min(W * 0.4, 430 * s + 60);
  const ph = Math.min(H * 0.62, 470 * s);
  return { trackY, baseY, lx: W / 2 - postGap, rx: W / 2 + postGap, ph, postGap };
}

// ---------- えがく ----------
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
}

function drawScene(L, t, th) {
  const g = ctx.createLinearGradient(0, 0, 0, L.trackY);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (th.moon) {
    ell(W * 0.84, H * 0.13, 42 * s, 42 * s, '#fff6cf');
    ell(W * 0.84 + 16 * s, H * 0.13 - 8 * s, 36 * s, 36 * s, th.sky[0]);
  } else {
    ell(W * 0.85, H * (th.sunY || 0.1), 50 * s, 50 * s, th.sun);
  }
  if (!th.night) clouds.forEach(c => {
    const x = ((c[0] * W + t * 12 * c[2]) % (W + 300)) - 150, y = c[1] * H, k = s * c[2];
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    [[0, 0, 40], [35, -15, 35], [70, 0, 38], [35, 10, 35]].forEach(([dx, dy, r]) => {
      ctx.beginPath(); ctx.arc(x + dx * k, y + dy * k, r * k, 0, Math.PI * 2); ctx.fill();
    });
  });
  th.far(L, t);
  ctx.fillStyle = th.ground; ctx.fillRect(0, L.trackY - 30 * s, W, H);
  if (th.near) th.near(L, t);
  // みち
  const roadTop = L.postGap * 0.55, roadBot = L.postGap * 0.95;
  ctx.fillStyle = th.night ? '#5c616b' : '#8a8f98';
  ctx.beginPath();
  ctx.moveTo(W / 2 - roadTop, L.trackY - 30 * s); ctx.lineTo(W / 2 + roadTop, L.trackY - 30 * s);
  ctx.lineTo(W / 2 + roadBot, H); ctx.lineTo(W / 2 - roadBot, H); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * s; ctx.setLineDash([30 * s, 25 * s]);
  ctx.beginPath(); ctx.moveTo(W / 2, L.trackY + 40 * s); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.setLineDash([]);
  // せんろ
  ctx.fillStyle = '#b89b7a'; ctx.fillRect(0, L.trackY - 22 * s, W, 44 * s);
  ctx.fillStyle = '#6b4a2e';
  for (let x = -20; x < W + 40; x += 38 * s) ctx.fillRect(x, L.trackY - 20 * s, 18 * s, 40 * s);
  ctx.fillStyle = '#555c66';
  ctx.fillRect(0, L.trackY - 14 * s, W, 6 * s);
  ctx.fillRect(0, L.trackY + 8 * s, W, 6 * s);
}

function drawSnow(t) {
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  flakes.forEach(([fx, fy, sp]) => {
    const y = ((fy * H + t * 40 * sp) % (H + 20)) - 10;
    const x = fx * W + Math.sin(t + fy * 10) * 15 * s;
    ctx.beginPath(); ctx.arc(x, y, (2 + sp * 2.5) * s, 0, Math.PI * 2); ctx.fill();
  });
}

function drawOni(L, t) {
  const feetY = L.trackY + 12 * s;
  const S = s * Math.min(1, (feetY - 12) / (450 * s));
  const step = Math.sin(walkDist / (62 * s));

  ctx.translate(0, -dance + zouJump);

function drawZou(L, t) {

  });
  const tu = trunkUp;
  ctx.strokeStyle = gray; ctx.lineWidth = 34; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(175, -170);
  ctx.bezierCurveTo(215, -140 - tu * 60, 215 - tu * 10, -70 - tu * 170, 245 + tu * 15, -55 - tu * 230 + Math.sin(t * 4) * 6);
  ctx.stroke();
  ell(135, -185, 72, 70, gray);
  const flap = Math.sin(t * 2.2) * 6;
  ctx.save(); ctx.translate(95, -180); ctx.rotate(flap * 0.02);
  ell(0, 0, 48 + flap * 0.4, 66, '#8c95a0'); ell(4, 0, 34, 50, '#e8b7c0');
  ctx.restore();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.moveTo(172, -145); ctx.quadraticCurveTo(205, -125, 215, -140); ctx.lineTo(178, -158); ctx.fill();
  ell(160, -205, 9, 11, '#222'); ell(163, -209, 3, 3, '#fff');
  ell(150, -175, 12, 7, 'rgba(255,140,160,0.45)');

  // せなかの どうぶつ（うえに いくほど ゆれる）
  hits.length = 0;
  let y = -226;
  riders.forEach((r, i) => {
    const bx = Math.sin(t * (2.6 + i * 0.35) + i * 1.3) * (3 + i * 6) - 10;
    ctx.save();
    ctx.translate(bx, y + r.jy);
    ctx.rotate(Math.sin(t * 2 + i) * 0.02 * i);
    ctx.scale(RS, RS);
    drawRider(r, t);
    ctx.restore();
    const cx = bx + (r.cx || 0) * RS;
    hits.push({ r, x: walkX + dir * cx * S, y: feetY + (y + r.jy - r.h * RS / 2 + oy) * S, w: (r.w * RS / 2 + 10) * S, h: (r.h * RS / 2 + 22) * S });
    y -= (r.h - 4) * RS;
  });
  ctx.restore();
}

function drawPost(L, x, side, t, active) {
  const lit = lightOn && active, down = active ? barDown : 0;
  const top = L.baseY - L.ph;
  const k = s;
  ctx.fillStyle = '#222';
  ctx.fillRect(x - 11 * k, top, 22 * k, L.ph);
  for (let y = L.baseY - 60 * k; y > top + 200 * k; y -= 36 * k) {
    ctx.fillStyle = '#ffd400'; ctx.fillRect(x - 11 * k, y, 22 * k, 18 * k);
  }
  ctx.fillStyle = '#555'; rr(x - 30 * k, L.baseY - 20 * k, 60 * k, 22 * k, 5 * k); ctx.fill();

  // ばつじるし
  ctx.save(); ctx.translate(x, top + 20 * k);
  [0.55, -0.55].forEach(a => {
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle = '#111'; ctx.fillRect(-72 * k, -14 * k, 144 * k, 28 * k);
    ctx.fillStyle = '#ffd400'; ctx.fillRect(-68 * k, -10 * k, 136 * k, 20 * k);
    ctx.fillStyle = '#111';
    for (let i = -60; i < 60; i += 28) ctx.fillRect(i * k, -10 * k, 12 * k, 20 * k);
    ctx.restore();
  });
  ctx.restore();

  // けいほうとう
  const ly = top + 110 * k;
  ctx.fillStyle = '#222'; ctx.fillRect(x - 80 * k, ly - 6 * k, 160 * k, 12 * k);
  [-1, 1].forEach((sd, i) => {
    const cx = x + sd * 58 * k;
    const on = lit && ((i === 0) === (lightSide === 0));
    if (on) {
      const gl = ctx.createRadialGradient(cx, ly, 5 * k, cx, ly, 90 * k);
      gl.addColorStop(0, 'rgba(255,60,40,0.7)'); gl.addColorStop(1, 'rgba(255,60,40,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, ly, 90 * k, 0, Math.PI * 2); ctx.fill();
    }
    ell(cx, ly, 40 * k, 40 * k, '#111');
    ell(cx, ly, 30 * k, 30 * k, on ? '#ff3b2f' : '#5a1a16');
    if (on) ell(cx - 9 * k, ly - 10 * k, 9 * k, 7 * k, 'rgba(255,255,255,0.7)');
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx, ly, 44 * k, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(cx, ly - 20 * k); ctx.fill();
  });

  // ほうこう やじるし
  const ay = ly + 70 * k;
  ctx.fillStyle = '#111'; rr(x - 42 * k, ay - 22 * k, 84 * k, 44 * k, 8 * k); ctx.fill();
  const arrowOn = active && (state === 'ringing' || state === 'crossing');
  ctx.fillStyle = arrowOn ? '#ffb000' : '#3a3020';
  ctx.save(); ctx.translate(x, ay); ctx.scale(dir, 1);
  ctx.beginPath();
  ctx.moveTo(26 * k, 0); ctx.lineTo(4 * k, -16 * k); ctx.lineTo(4 * k, -7 * k); ctx.lineTo(-28 * k, -7 * k);
  ctx.lineTo(-28 * k, 7 * k); ctx.lineTo(4 * k, 7 * k); ctx.lineTo(4 * k, 16 * k); ctx.fill();
  ctx.restore();

  // スピーカー
  ell(x, ay + 50 * k, 18 * k, 18 * k, '#333');
  if (lit) {
    ctx.strokeStyle = 'rgba(40,40,40,0.5)'; ctx.lineWidth = 3 * k;
    for (let r = 1; r <= 2; r++) {
      ctx.beginPath(); ctx.arc(x, ay + 50 * k, (18 + r * 12 + (t * 40 % 12)) * k, -0.6, 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, ay + 50 * k, (18 + r * 12 + (t * 40 % 12)) * k, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
    }
  }

  // しゃだんかん
  const py = L.baseY - L.ph * 0.28;
  const len = L.postGap - 20 * k;
  const ang = (1 - easeInOut(down)) * -Math.PI * 0.47;
  ctx.save();
  ctx.translate(x, py); ctx.scale(side, 1); ctx.rotate(ang);
  ctx.fillStyle = '#333'; rr(-60 * k, -16 * k, 55 * k, 32 * k, 6 * k); ctx.fill();
  ctx.fillStyle = '#111'; rr(0, -13 * k, len, 26 * k, 13 * k); ctx.fill();
  ctx.save();
  rr(2 * k, -10 * k, len - 4 * k, 20 * k, 10 * k); ctx.clip();
  ctx.fillStyle = '#ffd400'; ctx.fillRect(0, -10 * k, len, 20 * k);
  ctx.fillStyle = '#111';
  for (let i = 0; i < len; i += 48 * k) {
    ctx.beginPath();
    ctx.moveTo(i, 10 * k); ctx.lineTo(i + 20 * k, -10 * k); ctx.lineTo(i + 44 * k, -10 * k); ctx.lineTo(i + 24 * k, 10 * k); ctx.fill();
  }
  ctx.restore();
  for (let i = 60 * k; i < len - 20 * k; i += 55 * k) {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3 * k;
    ctx.beginPath(); ctx.moveTo(i, 12 * k); ctx.lineTo(i, 32 * k * easeInOut(down)); ctx.stroke();
  }
  ell(0, 0, 14 * k, 14 * k, '#555');
  ctx.restore();
}

const MOVE_TIME = 3.4;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

function drawHint(t) {
  const a = 0.6 + Math.sin(t * 4) * 0.4;
  const x = W / 2, y = H * 0.33;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  rr(x - 120 * s, y - 40 * s, 240 * s, 80 * s, 40 * s); ctx.fill();
  ctx.fillStyle = '#e8453c';
  ctx.font = `bold ${Math.round(40 * s)}px "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('さわってね', x, y + 2 * s);
  ctx.restore();
}

// ---------- うごき ----------
function update(dt) {
  stateT += dt;
  const ringing = state === 'ringing' || state === 'crossing' || state === 'raising';
  if (ringing) {
    kanTimer -= dt;
    if (kanTimer <= 0) { kanTimer += 0.46; kan(); lightOn = true; lightSide = 1 - lightSide; }
  } else { lightOn = false; }

  if (state === 'ringing') {
    if (stateT > 1.4) barDown = Math.min(1, barDown + dt / 3.4);
    if (barDown >= 1 && stateT > 5.2) {
      state = 'crossing'; stateT = 0;
      walkX = dir > 0 ? -380 * s : W + 380 * s; walkDist = 0; lastStep = 0;
      if (actor === 'oni') playMelody();
    }
  } else if (state === 'crossing') {
    const speed = (W + 760 * s) / 15;   // わたりきるまで 15びょう
    walkX += dir * speed * dt; walkDist += speed * dt;
    const stepIdx = Math.floor(walkDist / (60 * s * Math.PI));
    if (stepIdx !== lastStep) {
      lastStep = stepIdx; dosun(); shake = 4;
      puffs.push({ x: walkX + (Math.random() - 0.5) * 120 * s, y: layout().trackY + 10 * s, life: 0.6 });
    }
    if (actor === 'zou' && stateT > 1.5 && stateT - dt <= 1.5) { paon(); trunkUp = 1; say(WORDS.zou, walkX, layout().trackY - 280 * s); }
    if ((dir > 0 && walkX > W + 390 * s) || (dir < 0 && walkX < -390 * s)) { state = 'raising'; stateT = 0; }
  } else if (state === 'raising') {
    if (stateT > 0.8) barDown = Math.max(0, barDown - dt / 2.5);
    if (barDown <= 0 && stateT > 3.5) { state = 'moving'; stateT = 0; moveStepT = 0; nextTheme = pickNextTheme(); }
  } else if (state === 'moving') {
    moveStepT -= dt;
    if (moveStepT <= 0 && stateT < MOVE_TIME - 0.2) { moveStepT = 0.28; toko(Math.floor(stateT / 0.28) % 2); }
    if (stateT >= MOVE_TIME) { state = 'idle'; stateT = 0; rounds++; dir = -dir; curTheme = nextTheme; }
  } else if (state === 'idle' && rounds > 0 && stateT > 2) {
    start();
  }

  trunkUp = Math.max(0, trunkUp - dt * 0.9);
  shake = Math.max(0, shake - dt * 30);
  const fall = o => {
    if (o.vy !== 0 || o.jy < 0) { o.vy += 1600 * dt; o.jy += o.vy * dt; if (o.jy >= 0) { o.jy = 0; o.vy = 0; } }
  };
  riders.forEach(fall);
  const z = { jy: zouJump, vy: zouVy }; fall(z); zouJump = z.jy; zouVy = z.vy;
  for (let i = puffs.length - 1; i >= 0; i--) { puffs[i].life -= dt; if (puffs[i].life <= 0) puffs.splice(i, 1); }
}

let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  update(dt);
  const L = layout();
  ctx.save();
  if (shake > 0) ctx.translate(0, (Math.random() - 0.5) * shake);
  const off = state === 'moving' ? easeInOut(Math.min(1, stateT / MOVE_TIME)) * W : 0;
  const scenes = state === 'moving' ? [[curTheme, -off, true], [nextTheme, W - off, false]] : [[curTheme, 0, true]];
  scenes.forEach(([n, ox, active]) => {
    const th = THEMES[n];
    ctx.save();
    ctx.translate(ox, 0);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    drawScene(L, T, th);
    if (active && state === 'crossing') (actor === 'oni' ? drawOni : drawZou)(L, T);
    if (active) puffs.forEach(p => {
      const r = (1 - p.life / 0.6) * 40 * s + 10 * s;
      ell(p.x, p.y - (1 - p.life / 0.6) * 20 * s, r, r * 0.6, `rgba(210,190,160,${p.life})`);
    });
    drawPost(L, L.lx, 1, T, active);
    drawPost(L, L.rx, -1, T, active);
    if (th.snow) drawSnow(T);
    ctx.restore();
  });
  drawBubbles(dt);
  if (state === 'idle' && rounds === 0) drawHint(T);
  // おとが でない ときは、おしえてあげる
  if (!ac || ac.state !== 'running') {
    ctx.save();
    ctx.font = `bold ${Math.round(22 * s)}px "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const msg = 'おとが でないときは がめんを さわってね（マナーモードも オフに）';
    const w = ctx.measureText(msg).width + 28 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    rr(W / 2 - w / 2, 8 * s, w, 36 * s, 18 * s); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(msg, W / 2, 15 * s);
    ctx.restore();
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
// ネットが なくても あそべるように する
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
requestAnimationFrame(frame);
</script>
